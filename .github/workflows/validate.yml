# Validate every deposited workflow, and keep index.json honest.
#
# The check runs inside a checkout of Coda rather than here, because every question worth
# asking about a deposited graph needs Coda's node registry: whether `out.network` still
# exists, whether a param survived a rename, whether the declared `requires` matches the
# dataset nodes actually in the graph. A validator that only sees JSON can check that the
# braces balance, and the failure it misses is the one this repository has — a workflow
# deposited last year that opens today with a node silently dropped out of the middle of it.
#
# Three triggers, and the third is the point:
#
#   pull_request — you changed a workflow and did not regenerate index.json.
#   push         — the same, as a backstop for anything that lands without a PR.
#   schedule     — nothing here changed, and Coda moved underneath it. This is the drift
#                  alarm, and it is the only one that fires on the failure nobody is looking
#                  for. A red build here means a card in the browser now opens onto a hole.
name: Validate workflows

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:00 UTC. Weekly is the right cadence for drift: Coda is a prototype and its
    # registry moves, but a workflow that broke on Tuesday is no more broken by Friday.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history: index.json carries each entry's last-commit date, and a shallow clone
      # makes every one of them empty — which then differs from the committed file and fails
      # the check for a reason that has nothing to do with the change under review.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: zoo

      - uses: actions/checkout@v4
        with:
          repository: navis-org/coda
          path: coda

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: coda/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: coda/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: coda

      - run: pnpm zoo:index ../zoo --check
        working-directory: coda
